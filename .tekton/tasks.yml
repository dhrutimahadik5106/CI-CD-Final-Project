
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean up the workspace
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:3.18
      script: |
        #!/bin/sh
        echo "Cleaning workspace..."
        rm -rf "$(workspaces.source.path)"/*
        rm -rf "$(workspaces.source.path)"/.[!.]* 2>/dev/null || true
        echo "Workspace cleaned successfully"

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test
spec:
  description: Run JavaScript unit tests using Jest
  workspaces:
    - name: source
  steps:
    - name: jest-test
      image: node:20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        echo "Installing dependencies..."
        npm ci
        echo "Running Jest unit tests..."
        npx jest --coverage --runInBand
        echo "Unit tests completed successfully"
