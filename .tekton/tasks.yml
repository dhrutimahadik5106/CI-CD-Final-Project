apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean the shared workspace before cloning source code
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:3.19
      script: |
        #!/bin/sh
        set -eu
        echo "Starting cleanup task"
        cd "$(workspaces.source.path)"
        find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
        echo "Cleanup completed successfully"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test
spec:
  description: Run JavaScript unit tests using Jest
  workspaces:
    - name: source
  steps:
    - name: jest
      image: node:20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        echo "Installing Node.js dependencies"
        npm ci
        echo "Running Jest unit tests"
        npm test -- --runInBand
        echo "Jest tests completed successfully"
