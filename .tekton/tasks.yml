
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:3.19
      script: |
        #!/bin/sh
        set -eu
        echo "Cleaning workspace"
        find "$(workspaces.source.path)" -mindepth 1 \
          -maxdepth 1 -exec rm -rf -- {} +
        echo "Workspace cleanup completed"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: eslint
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: node:20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        npm ci
        npm run lint
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: jest
spec:
  workspaces:
    - name: source
  steps:
    - name: test
      image: node:20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        npm ci
        npm test -- --runInBand
        echo "Unit tests completed successfully"
